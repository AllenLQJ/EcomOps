services:
  postgres:
    image: postgres:15
    container_name: ecomops-postgres
    environment:
      POSTGRES_PASSWORD: ecomops_pw
      POSTGRES_DB: ecomops
      TZ: Asia/Shanghai
    command: ["postgres", "-c", "max_connections=300"]
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes: [ecomops_pg:/var/lib/postgresql/data]
  minio:
    profiles: [minio]   # 本机无法拉取镜像时默认不启动；ObjectStore 自动回退本地文件系统
    image: minio/minio
    container_name: ecomops-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ecomops
      MINIO_ROOT_PASSWORD: ecomops_minio_pw
    ports: ["9000:9000", "9001:9001"]
    volumes: [ecomops_minio:/data]
volumes:
  ecomops_pg:
  ecomops_minio:
